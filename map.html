<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMSA Shed Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-dark: #1e4d0f;
    --green-mid:  #2d7a1a;
    --green-pale: #e8f5e2;
    --white:      #ffffff;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ─────────────────────────────────────── */
  header {
    background: var(--green-dark);
    color: white;
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 100;
  }
  .shed-info h1 {
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60vw;
  }
  .shed-info p {
    font-size: 11px;
    color: var(--green-pale);
    opacity: 0.9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60vw;
  }
  .back-btn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }

  /* ── MAP ─────────────────────────────────────────── */
  #map {
    flex: 1;
    width: 100%;
  }

  /* ── ERROR ───────────────────────────────────────── */
  .error-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #888;
  }
</style>
</head>
<body>

<header>
  <div class="shed-info">
    <h1 id="shed-name">Loading…</h1>
    <p id="shed-address"></p>
  </div>
  <button class="back-btn" onclick="window.close()">&#8592; Back to Directory</button>
</header>

<div id="map"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name    = params.get('name')    || 'Unknown Shed';
  const address = params.get('address') || '';
  const lat     = parseFloat(params.get('lat'));
  const lon     = parseFloat(params.get('lon'));

  document.getElementById('shed-name').textContent    = name;
  document.getElementById('shed-address').textContent = address;
  document.title = name + ' — AMSA Map';

  if (isNaN(lat) || isNaN(lon)) {
    document.getElementById('map').outerHTML =
      '<div class="error-screen">No location data available for this shed.</div>';
  } else {
    const map = L.map('map').setView([lat, lon], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Custom green marker
    const icon = L.divIcon({
      html: '<div style="background:#1e4d0f;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
      popupAnchor: [0, -10],
      className: ''
    });

    L.marker([lat, lon], { icon })
      .addTo(map)
      .bindPopup(
        '<div style="font-family:Segoe UI,sans-serif;min-width:160px;">' +
        '<strong style="font-size:13px;color:#1e4d0f;">' + name + '</strong>' +
        (address ? '<br><span style="font-size:11px;color:#666;">' + address + '</span>' : '') +
        '<br><br>' +
        '<a href="https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lon + '" ' +
        'target="_blank" style="font-size:11px;color:#2c5f8a;font-weight:600;">Get directions ↗</a>' +
        '</div>',
        { maxWidth: 220 }
      )
      .openPopup();
  }
</script>
</body>
</html>
